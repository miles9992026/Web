<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="hmTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b8a8f"/>
      <stop offset="100%" stop-color="#055b5f"/>
    </linearGradient>
    <linearGradient id="hmSunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9e3b"/>
      <stop offset="100%" stop-color="#ff7a1a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(10, 8)">
    <!-- Outer Glow Circle -->
    <circle cx="32" cy="32" r="30" fill="url(#hmTealGrad)" filter="url(#shadow)"/>
    <circle cx="32" cy="32" r="28" fill="none" stroke="#fdf6ec" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- Sun -->
    <circle cx="44" cy="22" r="7" fill="url(#hmSunGrad)"/>
    
    <!-- Mountain Ridges -->
    <polygon points="14,48 26,30 38,48" fill="#e0f2f1" opacity="0.9"/>
    <polygon points="28,48 40,26 52,48" fill="#ffffff"/>
    
    <!-- Wave / Road at base -->
    <path d="M12,46 Q 24,52 36,46 T 52,48" fill="none" stroke="#ff7a1a" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Flying Airplane Path -->
    <path d="M16,26 Q 30,12 46,20" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 2"/>
    <polygon points="46,18 52,20 48,24" fill="#ffffff"/>
  </g>

  <!-- Typography -->
  <g transform="translate(85, 18)">
    <!-- Brand Title -->
    <text x="0" y="26" font-family="'Playfair Display', Georgia, serif" font-size="25" font-weight="800" fill="#0e2a33" letter-spacing="0.5">
      HAPPY<tspan fill="#ff7a1a">MILES</tspan>
    </text>
    <text x="160" y="24" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#0b8a8f" letter-spacing="3">
      TOURS
    </text>
    
    <!-- Tagline -->
    <text x="2" y="44" font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#607274" letter-spacing="1.2">
      TURNING MILES INTO MEMORIES
    </text>
  </g>
</svg>
